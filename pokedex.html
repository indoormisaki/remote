<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pokemon sample</title>
<link rel="stylesheet" type="text/css" href="css/style.css">
<style>.hidden { display: none; }</style>
</head>
<body>
	<div id="message" class="hidden"></div>
	<div id="loading">読み込み中...</div>
	<div id="pokedex" class="hidden">
		<img id="front-sprite" alt="">
		<img id="back-sprite" alt="">
		<div>図鑑No：<span id="no"></span></div>
		<div>なまえ：<span id="name"></span></div>
		<div id="types"></div>
		<div id="abilities"></div>
		<div>たかさ：<span id="height"></span>m</div>
		<div>おもさ：<span id="weight"></span>kg</div>
		<div>HP：<span id="hp"></span></div>
		<div>こうげき：<span id="attack"></span></div>
		<div>ぼうぎょ：<span id="defense"></span></div>
		<div>とくこう：<span id="special-attack"></span></div>
		<div>とくぼう：<span id="special-defense"></span></div>
		<div>すばやさ：<span id="speed"></span></div>
	</div>
	<div><a href="index.html">もどる</a></div>

	<script src="js/translations.js"></script>
	<script src="js/common.js"></script>
	<script src="js/pokedex.js"></script>
</body>
</html>
