<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b1230">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="人狼めくり">
<title>人狼めくり</title>
<style>
:root{--bg:#1b1230;--panel:#2a1d49;--text:#f4efff;--sub:#b9aedb;--accent:#ff7a59;--ok:#5ad6a0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Hiragino Sans",sans-serif;min-height:100vh;padding:16px;padding-bottom:env(safe-area-inset-bottom)}
main{max-width:480px;margin:0 auto}
h1{font-size:22px;margin:4px 0 16px;text-align:center}
h2{font-size:16px;margin:20px 0 8px;color:var(--sub)}
.panel{background:var(--panel);border-radius:14px;padding:14px;margin-bottom:12px}
button{font:inherit;color:var(--text);background:#41306e;border:0;border-radius:12px;padding:12px 16px;cursor:pointer}
button.primary{background:var(--accent);color:#fff;font-weight:700;width:100%;padding:16px;font-size:18px}
button.small{padding:6px 10px;font-size:13px}
input,select{font:inherit;color:var(--text);background:#1b1230;border:1px solid #4b3a7e;border-radius:10px;padding:10px;min-width:0}
.row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.row input{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:#41306e;border-radius:99px;padding:6px 12px;display:flex;gap:8px;align-items:center}
.chip b{cursor:pointer;color:var(--sub)}
.card-row{display:grid;grid-template-columns:44px 1fr 56px;gap:6px;margin-bottom:6px}
.card-row select{grid-column:1/-1}
.card-row .e{text-align:center;padding:10px 0}
.hidden{display:none}
.deck{position:relative;height:280px;margin:12px auto;width:200px;perspective:800px}
.card{position:absolute;inset:0;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:12px}
.back{background:repeating-linear-gradient(45deg,#5b3fa6,#5b3fa6 10px,#4a3190 10px,#4a3190 20px);border:4px solid #fff;font-size:64px;box-shadow:0 8px 0 #0006}
.face{background:#fff;color:#222;border:4px solid var(--accent);animation:flip .4s}
.face .em{font-size:84px;line-height:1}
.face .nm{font-size:24px;font-weight:700;margin-top:8px}
@keyframes flip{from{transform:rotateY(90deg)}to{transform:rotateY(0)}}
.turn{text-align:center;color:var(--sub)}
.turn b{color:var(--text);font-size:20px}
.result{background:var(--accent);color:#fff;border-radius:14px;padding:14px;text-align:center;font-size:22px;font-weight:800;margin:8px 0;min-height:64px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px}
.result small{font-size:13px;font-weight:400;opacity:.9}
.result.safe{background:var(--ok);color:#073}
.pick{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px 0}
.log{font-size:13px;color:var(--sub);max-height:140px;overflow:auto}
.log div{padding:3px 0;border-bottom:1px solid #ffffff12}
.status{text-align:center;color:var(--sub);font-size:13px;margin:6px 0}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{flex:1}
.tabs button.on{background:var(--accent);font-weight:700}
.fighters{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0}
.fighter{background:var(--panel);border-radius:14px;padding:10px;text-align:center;border:3px solid transparent}
.fighter.active{border-color:var(--accent)}
.fighter .em{font-size:48px;line-height:1.1}
.fighter .fn{font-weight:700;margin-top:2px;word-break:break-all}
.fighter .fr{font-size:12px;color:var(--sub)}
.hp{height:12px;background:#0006;border-radius:99px;overflow:hidden;margin-top:6px}
.hp i{display:block;height:100%;background:var(--ok);transition:width .4s}
.hp i.low{background:var(--accent)}
.tag{font-size:12px;color:var(--sub);min-height:16px;margin-top:4px}
.moves{display:grid;gap:8px;margin:10px 0}
.moves button{text-align:left;padding:12px 14px}
.moves button small{display:block;color:var(--sub);font-size:12px}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

</style>
</head>
<body>
<main>
<h1>🐺 人狼めくり</h1>
<div class="tabs"><button id="tabFlip" class="on">めくり</button><button id="tabBattle">⚔️ バトル</button></div>

<!-- 設定画面 -->
<section id="setup">
  <h2>参加者(めくる順)</h2>
  <div class="panel">
    <div class="row"><input id="nameIn" placeholder="名前を入力" maxlength="12"><button id="addBtn">追加</button></div>
    <div class="chips" id="players"></div>
  </div>

  <h2>山札(カード)</h2>
  <div class="panel" id="cardEdit"></div>
  <div class="row">
    <button class="small" id="addCard">＋ カード追加</button>
    <button class="small" id="resetCards">初期化</button>
    <span class="status" id="deckCount" style="margin:0 0 0 auto"></span>
  </div>

  <button class="primary" id="startBtn" style="margin-top:12px">ゲーム開始</button>
</section>

<!-- ゲーム画面 -->
<section id="game" class="hidden">
  <div class="turn">次にめくる人<br><b id="turnName"></b></div>
  <div class="deck" id="deck"></div>
  <div class="status" id="remain"></div>
  <div class="result safe hidden" id="result"></div>
  <div class="pick hidden" id="pickArea"></div>
  <button class="primary" id="flipBtn">山札をめくる</button>
  <div class="row" style="margin-top:12px"><button class="small" id="backBtn">設定に戻る</button><button class="small" id="restartBtn">最初からやり直す</button></div>
  <h2>ログ</h2>
  <div class="panel log" id="log"></div>
</section>

<!-- バトル設定 -->
<section id="bsetup" class="hidden">
  <h2>ファイター</h2>
  <div class="panel" id="bfighters"></div>
  <div class="status">HPが0になった方が負け。負けた人が飲む!</div>
  <button class="primary" id="bstart">バトル開始</button>
</section>

<!-- バトル画面 -->
<section id="battle" class="hidden">
  <div class="fighters" id="bboard"></div>
  <div class="turn"><b id="bturn"></b> の番</div>
  <div class="moves" id="bmoves"></div>
  <div class="result safe hidden" id="bresult"></div>
  <div class="row"><button class="small" id="bback">設定に戻る</button><button class="small" id="brestart">同じ組み合わせで再戦</button></div>
  <h2>ログ</h2>
  <div class="panel log" id="blog"></div>
</section>
</main>
<script>
const EFFECTS = {
  self:"めくった本人が飲む",
  none:"セーフ(誰も飲まない)",
  pick:"めくった人が指名→指名された人が飲む",
  guard:"次にめくる人の「飲む」を肩代わり",
  all:"全員で乾杯(全員が飲む)",
  last:"一番最近飲んだ人がもう一度飲む",
  neighbor:"めくった人と次の人が一緒に飲む"
};
const DEFAULT_CARDS = [
  {emoji:"🐺",name:"人狼",count:2,effect:"self"},
  {emoji:"🧑‍🌾",name:"村人",count:8,effect:"none"},
  {emoji:"🔮",name:"占い師",count:2,effect:"pick"},
  {emoji:"🛡️",name:"騎士",count:2,effect:"guard"},
  {emoji:"👑",name:"村長",count:1,effect:"all"},
  {emoji:"🦊",name:"妖狐",count:2,effect:"last"},
  {emoji:"💘",name:"恋人",count:2,effect:"neighbor"}
];
const $ = id => document.getElementById(id);
const load = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? d; } catch { return d; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

let players = load("wd_players", []);
let cards = load("wd_cards", DEFAULT_CARDS);
let g = null; // ゲーム状態

/* ---------- 設定画面 ---------- */
function renderPlayers(){
  $("players").innerHTML = "";
  players.forEach((p,i)=>{
    const c = document.createElement("span");
    c.className = "chip";
    c.append(p);
    const x = document.createElement("b"); x.textContent = "×";
    x.onclick = () => { players.splice(i,1); save("wd_players",players); renderPlayers(); };
    c.append(x); $("players").append(c);
  });
}
function renderCards(){
  const box = $("cardEdit"); box.innerHTML = "";
  cards.forEach((c,i)=>{
    const row = document.createElement("div"); row.className = "card-row";
    const mk = (val, key, extra={}) => {
      const el = document.createElement("input"); el.value = val; Object.assign(el, extra);
      el.oninput = () => { cards[i][key] = key==="count" ? Math.max(0,parseInt(el.value)||0) : el.value; save("wd_cards",cards); updateCount(); };
      return el;
    };
    const em = mk(c.emoji,"emoji"); em.className = "e";
    row.append(em, mk(c.name,"name",{placeholder:"役職名"}), mk(c.count,"count",{type:"number",min:0,inputMode:"numeric"}));
    const sel = document.createElement("select");
    for (const k in EFFECTS){ const o = document.createElement("option"); o.value=k; o.textContent=EFFECTS[k]; sel.append(o); }
    sel.value = c.effect;
    sel.onchange = () => { cards[i].effect = sel.value; save("wd_cards",cards); };
    const del = document.createElement("button"); del.className="small"; del.textContent="削除"; del.style.gridColumn="1/-1";
    del.onclick = () => { cards.splice(i,1); save("wd_cards",cards); renderCards(); };
    row.append(sel, del); box.append(row);
    if (i < cards.length-1){ const hr=document.createElement("hr"); hr.style.cssText="border:0;border-top:1px solid #ffffff18;margin:10px 0"; box.append(hr); }
  });
  updateCount();
}
function updateCount(){ $("deckCount").textContent = "合計 " + cards.reduce((s,c)=>s+c.count,0) + " 枚"; }

$("addBtn").onclick = addPlayer;
$("nameIn").onkeydown = e => { if (e.key==="Enter") addPlayer(); };
function addPlayer(){
  const v = $("nameIn").value.trim();
  if (!v) return;
  if (players.includes(v)) { alert("同じ名前がいます"); return; }
  players.push(v); save("wd_players",players); $("nameIn").value=""; renderPlayers();
}
$("addCard").onclick = () => { cards.push({emoji:"🍺",name:"新カード",count:1,effect:"self"}); save("wd_cards",cards); renderCards(); };
$("resetCards").onclick = () => { if (confirm("カードを初期状態に戻しますか?")) { cards = JSON.parse(JSON.stringify(DEFAULT_CARDS)); save("wd_cards",cards); renderCards(); } };

/* ---------- ゲーム ---------- */
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

$("startBtn").onclick = () => {
  if (players.length < 2) { alert("参加者を2人以上追加してください"); return; }
  const deck = [];
  cards.forEach(c => { for(let i=0;i<c.count;i++) deck.push(c); });
  if (!deck.length) { alert("山札が空です。枚数を設定してください"); return; }
  g = { deck: shuffle(deck), turn: 0, lastDrinker: null, guard: null, waitingPick: false, log: [] };
  $("setup").classList.add("hidden"); $("game").classList.remove("hidden");
  $("log").innerHTML = "";
  showBack(); updateTurn(); showResult(null);
};
$("backBtn").onclick = () => { $("game").classList.add("hidden"); $("setup").classList.remove("hidden"); };
$("restartBtn").onclick = () => { if (confirm("山札をシャッフルして最初からやり直しますか?")) $("startBtn").click(); };

function showBack(){ $("deck").innerHTML = '<div class="card back">🍺</div>'; }
function showFace(c){ $("deck").innerHTML = `<div class="card face"><div class="em">${esc(c.emoji)}</div><div class="nm">${esc(c.name)}</div></div>`; }
function esc(s){ return String(s).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }
function cur(){ return players[g.turn % players.length]; }
function nextP(){ return players[(g.turn+1) % players.length]; }
function updateTurn(){
  $("turnName").textContent = cur();
  $("remain").textContent = g.deck.length ? `山札 残り ${g.deck.length} 枚` : "山札はもうありません";
  $("flipBtn").textContent = g.deck.length ? "山札をめくる" : "終了!もう一度遊ぶ";
}
function showResult(html, safe){
  const r = $("result");
  if (html == null){ r.classList.add("hidden"); return; }
  r.classList.remove("hidden"); r.classList.toggle("safe", !!safe); r.innerHTML = html;
}
function addLog(t){ g.log.unshift(t); const d=document.createElement("div"); d.textContent=t; $("log").prepend(d); }

$("flipBtn").onclick = () => {
  if (g.waitingPick) return;
  if (!g.deck.length) { $("startBtn").click(); return; }
  const c = g.deck.shift(), me = cur();
  showFace(c);
  let drinkers = [], note = "";
  switch (c.effect){
    case "self": drinkers = [me]; break;
    case "none": break;
    case "all": drinkers = [...players]; break;
    case "neighbor": drinkers = [...new Set([me, nextP()])]; break;
    case "last":
      if (g.lastDrinker){ drinkers = [g.lastDrinker]; note = "直近で飲んだ人"; }
      else { drinkers = [me]; note = "まだ誰も飲んでいないので本人"; }
      break;
    case "guard":
      g.guard = me; note = `次にめくる人の分を${me}が肩代わり`; break;
    case "pick":
      g.waitingPick = true;
      showResult(`${esc(me)}さん、飲ませる人を指名!`, false);
      const area = $("pickArea"); area.innerHTML = ""; area.classList.remove("hidden");
      players.filter(p => p !== me).forEach(p => {
        const b = document.createElement("button"); b.textContent = p;
        b.onclick = () => { area.classList.add("hidden"); g.waitingPick = false; finish(c, me, [p], `${me}の指名`); };
        area.append(b);
      });
      $("flipBtn").disabled = true;
      return;
  }
  finish(c, me, drinkers, note);
};

function finish(c, me, drinkers, note){
  // 騎士の肩代わり(前のカードで発動済み。今回のめくった人が飲む分を引き受ける)
  if (g.guard && c.effect !== "guard"){
    const guardian = g.guard, flipper = me;
    if (drinkers.includes(flipper) && guardian !== flipper){
      drinkers = [...new Set(drinkers.map(d => d === flipper ? guardian : d))];
      note += (note ? " / " : "") + `🛡️${guardian}が${flipper}の分を肩代わり`;
    }
    g.guard = null;
  }
  if (drinkers.length) g.lastDrinker = drinkers[drinkers.length-1];
  $("flipBtn").disabled = false;
  if (navigator.vibrate) navigator.vibrate(drinkers.length ? [120,60,120] : 40);
  if (drinkers.length){
    const all = drinkers.length === players.length && players.length > 1;
    showResult(`🍻 ${all ? "全員" : esc(drinkers.join("、")) + "さん"}が飲む!${note ? `<small>${esc(note)}</small>` : ""}`, false);
  } else {
    showResult(`${c.effect==="guard" ? "🛡️ 騎士!" : "セーフ!"}${note ? `<small>${esc(note)}</small>` : ""}`, true);
  }
  addLog(`${me}:${c.emoji}${c.name} → ${drinkers.length ? drinkers.join("、") + "が飲む" : "飲まない"}${note ? "(" + note + ")" : ""}`);
  g.turn++; updateTurn();
}


/* ---------- モード切り替え ---------- */
const SECTIONS = ["setup","game","bsetup","battle"];
function show(id){ SECTIONS.forEach(x => $(x).classList.toggle("hidden", x !== id)); }
$("tabFlip").onclick = () => { $("tabFlip").classList.add("on"); $("tabBattle").classList.remove("on"); show(g ? "game" : "setup"); };
$("tabBattle").onclick = () => { $("tabBattle").classList.add("on"); $("tabFlip").classList.remove("on"); if (b) show("battle"); else { renderBSetup(); show("bsetup"); } };

/* ---------- バトル ---------- */
const HP_MAX = 30;
const ROLES = {
  wolf:  {emoji:"🐺",name:"人狼",  moves:[{n:"かみつく",t:"atk",d:8,acc:100},{n:"襲撃",t:"atk",d:15,acc:60},{n:"遠吠え",t:"buff"}]},
  seer:  {emoji:"🔮",name:"占い師",moves:[{n:"凶星",t:"atk",d:9,acc:90},{n:"予知",t:"guard"},{n:"祈り",t:"heal",d:8}]},
  knight:{emoji:"🛡️",name:"騎士",  moves:[{n:"剣撃",t:"atk",d:8,acc:95},{n:"突撃",t:"atk",d:12,acc:75},{n:"盾構え",t:"guard"}]},
  fox:   {emoji:"🦊",name:"妖狐",  moves:[{n:"狐火",t:"atk",d:7,acc:100},{n:"化かす",t:"atk",d:11,acc:80},{n:"変化",t:"heal",d:6}]},
  mayor: {emoji:"👑",name:"村長",  moves:[{n:"号令",t:"atk",d:10,acc:85},{n:"演説",t:"buff"},{n:"酒盛り",t:"heal",d:10}]}
};
let b = null;
let bsel = load("wd_battle", {names:["",""],roles:["wolf","knight"]});

function moveDesc(m){
  return {atk:`攻撃 ${m.d}ダメージ(命中${m.acc}%)`,
          heal:`HPを${m.d}回復`,
          guard:"次に受けるダメージを半分にする",
          buff:"次の攻撃のダメージ+5"}[m.t];
}
function renderBSetup(){
  const box = $("bfighters"); box.innerHTML = "";
  for (let i=0;i<2;i++){
    const wrap = document.createElement("div");
    const name = document.createElement("input");
    name.placeholder = `プレイヤー${i+1}の名前`; name.maxLength = 12; name.style.width = "100%";
    name.value = bsel.names[i] || players[i] || "";
    name.oninput = () => { bsel.names[i] = name.value; save("wd_battle",bsel); };
    const sel = document.createElement("select"); sel.style.cssText = "width:100%;margin-top:6px";
    for (const k in ROLES){ const o=document.createElement("option"); o.value=k; o.textContent=ROLES[k].emoji+" "+ROLES[k].name; sel.append(o); }
    sel.value = bsel.roles[i];
    const info = document.createElement("div"); info.className = "status"; info.style.textAlign = "left";
    const upd = () => { info.innerHTML = ROLES[sel.value].moves.map(m => `・${esc(m.n)}:${moveDesc(m)}`).join("<br>"); };
    sel.onchange = () => { bsel.roles[i] = sel.value; save("wd_battle",bsel); upd(); };
    upd();
    wrap.append(name, sel, info);
    box.append(wrap);
    if (i === 0){ const hr=document.createElement("hr"); hr.style.cssText="border:0;border-top:1px solid #ffffff18;margin:12px 0"; box.append(hr); }
  }
}
function startBattle(){
  const names = [0,1].map(i => (bsel.names[i] || players[i] || `プレイヤー${i+1}`).trim() || `プレイヤー${i+1}`);
  if (names[0] === names[1]) names[1] += "2";
  b = { f: [0,1].map(i => ({name:names[i], role:ROLES[bsel.roles[i]], hp:HP_MAX, guard:false, buff:false})), turn: Math.floor(Math.random()*2), over:false };
  $("blog").innerHTML = ""; $("bresult").classList.add("hidden");
  show("battle"); renderBattle();
  blog(`${b.f[b.turn].name}の先攻!`);
}
$("bstart").onclick = startBattle;
$("brestart").onclick = startBattle;
$("bback").onclick = () => { b = null; renderBSetup(); show("bsetup"); };

function blog(t){ const d=document.createElement("div"); d.textContent=t; $("blog").prepend(d); }
function renderBattle(){
  $("bboard").innerHTML = b.f.map((f,i) => {
    const pct = Math.max(0, f.hp/HP_MAX*100);
    const tags = [f.guard?"🛡️防御中":"", f.buff?"💪強化中":""].filter(Boolean).join(" ");
    return `<div class="fighter ${i===b.turn&&!b.over?"active":""}" id="fi${i}">
      <div class="em">${f.role.emoji}</div><div class="fn">${esc(f.name)}</div><div class="fr">${esc(f.role.name)}</div>
      <div class="hp"><i class="${pct<35?"low":""}" style="width:${pct}%"></i></div>
      <div class="fr">HP ${f.hp}/${HP_MAX}</div><div class="tag">${tags}</div></div>`;
  }).join("");
  const me = b.f[b.turn];
  $("bturn").textContent = me.name; $("bturn").parentElement.style.visibility = b.over ? "hidden" : "visible";
  $("bmoves").innerHTML = "";
  if (b.over) return;
  me.role.moves.forEach(m => {
    const btn = document.createElement("button");
    btn.innerHTML = `${esc(m.n)}<small>${moveDesc(m)}</small>`;
    btn.onclick = () => useMove(m);
    $("bmoves").append(btn);
  });
}
function useMove(m){
  const me = b.f[b.turn], foe = b.f[1-b.turn];
  let msg;
  if (m.t === "atk"){
    if (Math.random()*100 >= m.acc) msg = `${me.name}の${m.n}!……ミス!`;
    else {
      let d = m.d + (me.buff ? 5 : 0);
      me.buff = false;
      let extra = "";
      if (foe.guard){ d = Math.ceil(d/2); foe.guard = false; extra = "(防御で半減)"; }
      foe.hp = Math.max(0, foe.hp - d);
      msg = `${me.name}の${m.n}!${foe.name}に${d}ダメージ${extra}`;
      const el = $("fi"+(1-b.turn)); if (el){ el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake"); }
    }
  } else if (m.t === "heal"){
    const before = me.hp; me.hp = Math.min(HP_MAX, me.hp + m.d);
    msg = `${me.name}の${m.n}!HPが${me.hp-before}回復`;
  } else if (m.t === "guard"){
    me.guard = true; msg = `${me.name}の${m.n}!次のダメージを半減`;
  } else {
    me.buff = true; msg = `${me.name}の${m.n}!次の攻撃が強化された`;
  }
  blog(msg);
  if (foe.hp <= 0){
    b.over = true; renderBattle();
    const r = $("bresult"); r.classList.remove("hidden"); r.classList.remove("safe");
    r.innerHTML = `🏆 ${esc(me.name)}の勝ち!<span>🍻 ${esc(foe.name)}さんが飲む!</span>`;
    blog(`決着!${foe.name}が飲む`);
    return;
  }
  b.turn = 1 - b.turn;
  $("bresult").classList.add("hidden");
  renderBattle();
  $("bresult").classList.remove("hidden"); $("bresult").classList.add("safe"); $("bresult").textContent = msg;
}

/* ---------- PWA / 画面スリープ防止 ---------- */
let wake = null;
async function keepAwake(){
  try { if ("wakeLock" in navigator && !wake) { wake = await navigator.wakeLock.request("screen"); wake.addEventListener("release", () => { wake = null; }); } } catch {}
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") keepAwake(); });
document.addEventListener("click", keepAwake, {once:true});
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(() => {});

renderPlayers(); renderCards();
</script>
